[package]
name = "librespydus-cli"
version = "0.1.0"
edition = "2024"
description = "spydus: LibreSpydus for the terminal, on the shared Rust core (docs/cli.md)"
publish = false

[lib]
name = "librespydus_cli"
path = "src/lib.rs"

[[bin]]
name = "spydus"
path = "src/main.rs"

[dependencies]
librespydus-core = { path = "../core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
clap = { version = "4", features = ["derive", "wrap_help"] }
clap_complete = "4"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
sha2 = "0.10"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native-sync-persistent"] }
dirs = "6"
anyhow = "1"
anstream = "0.6"
anstyle = "1"
terminal_size = "0.4"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
